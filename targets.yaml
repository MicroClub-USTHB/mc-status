interval: 60 # seconds between HTTP/TCP checks
timeout: 10  # seconds before a network probe times out

# Names, groups, and check IDs are public display text; do not put secrets here.
# Groups: Core, Infra, Repos. Check types: http, tcp, dns, tls, repo (exact spelling).
# Empty addresses disable checks. Fill these in, validate, then restart.
projects:
  - name: Micro Club website
    group: Core
    checks:
      - id: web
        type: http
        url: "https://www.microclub.info/"
      - id: dns
        type: dns
        url: "" # TODO: real hostname
      - id: certificate
        type: tls
        url: "" # TODO: real HTTPS URL

